<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>macfeel</title>
<script>
  (() => {
    const pref = localStorage.getItem("macfeel.theme") || "auto";
    const dark = pref === "dark" || (pref === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    document.documentElement.dataset.pref = pref;
  })();
</script>
<style>
  :root {
    --paper: #f6f3ea; --ink: #17140f; --muted: #6b6355; --rule: #d9d2c2;
    --accent: #b3402a; --ok: #2f6b3f; --warn: #a2711b; --mono: "SF Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  /* kill the UA rounding on controls without poisoning class-level radii */
  button, select, input, textarea { border-radius: 0; }
  body { margin: 0; background: var(--paper); color: var(--ink);
         font: 14px/1.5 -apple-system, "Helvetica Neue", "PingFang HK", sans-serif; }
  header { border-bottom: 2px solid var(--ink); padding: 18px 28px 0; }
  .top { display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; }
  h1 { margin: 0; font: 700 26px/1 var(--mono); letter-spacing: .18em; }
  .meta { font: 12px var(--mono); color: var(--muted); }
  .spacer { flex: 1; }
  .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  select, button { font: 12px var(--mono); padding: 7px 12px; background: transparent;
                   border: 1px solid var(--ink); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--ink); color: var(--paper); }
  button:hover { background: var(--ink); color: var(--paper); }
  button.primary:hover { background: var(--accent); border-color: var(--accent); }
  nav { display: flex; gap: 0; margin-top: 16px; overflow-x: auto; }
  nav button { border: 0; border-bottom: 3px solid transparent; padding: 10px 16px;
               font: 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; }
  nav button.on { border-bottom-color: var(--accent); color: var(--accent); }
  nav button span { color: var(--muted); margin-left: 6px; }
  main { padding: 22px 28px 80px; max-width: 1180px; }
  .lede { font: 12px var(--mono); color: var(--muted); margin: 0 0 6px; }
  .legend { font: 11px var(--mono); color: var(--muted); margin: 0 0 18px; }
  .legend b { font-weight: 600; }
  .row { display: grid; grid-template-columns: minmax(0,1fr) 190px; gap: 18px;
         padding: 14px 0; border-top: 1px solid var(--rule); align-items: start; }
  .row:first-of-type { border-top: 2px solid var(--ink); }
  .name { font-weight: 600; }
  .note { color: var(--muted); margin: 3px 0 5px; max-width: 62ch; }
  .key { font: 11px var(--mono); color: var(--muted); word-break: break-all; }
  .tag { font: 10px var(--mono); color: var(--accent); border: 1px solid var(--accent);
         padding: 1px 6px; margin-left: 8px; white-space: nowrap; }
  .side { text-align: right; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  .switch { width: 46px; height: 22px; padding: 0; border: 1px solid var(--ink); background: transparent;
            position: relative; cursor: pointer; }
  .switch span { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
                 background: var(--ink); transition: left .12s linear, background .12s linear; }
  .switch[aria-checked="true"] { border-color: var(--ok); }
  .switch[aria-checked="true"] span { left: 26px; background: var(--ok); }
  .switch:hover { border-color: var(--accent); }
  .switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .state-label { font: 10px var(--mono); letter-spacing: .08em; color: var(--muted); min-width: 24px; text-align: right; }
  .state-label.on { color: var(--ok); }
  .swrow { display: flex; align-items: center; gap: 8px; }
  .badge { font: 10px var(--mono); letter-spacing: .08em; padding: 0; border: 0; opacity: .75; }
  .sync { color: var(--ok); } .drift { color: var(--warn); } .unset { color: var(--muted); }
  #out { white-space: pre-wrap; font: 12px var(--mono); background: #fffdf7;
         border: 1px solid var(--rule); padding: 12px; margin-top: 22px; display: none; }
  #out.on { display: block; }
  footer { border-top: 1px solid var(--rule); margin-top: 30px; padding-top: 12px;
           font: 11px var(--mono); color: var(--muted); }
  a { color: var(--accent); }





  /* ---- change summary ---- */
  .modal { position: fixed; inset: 0; background: rgba(26,26,26,.42); display: grid; place-items: center; z-index: 50; }
  .modal[hidden] { display: none; }
  .modal .card { width: min(520px, calc(100vw - 40px)); max-height: 76vh; display: flex; flex-direction: column;
                 background: var(--paper); border: 1px solid var(--ink); padding: 20px 22px 16px; }
  .modal h2 { margin: 0 0 4px; font-size: 15px; }
  .modal-sub { margin: 0 0 12px; font-size: 12px; color: #6d685e; }
  #modal-list { list-style: none; margin: 0; padding: 0; overflow-y: auto; border-top: 1px solid var(--rule); }
  #modal-list li.head { font-size: 10.5px; letter-spacing: .08em; color: #8d887c; border-bottom: 1px solid var(--rule); }
  #modal-list li { display: flex; justify-content: space-between; gap: 14px; padding: 7px 0; border-bottom: 1px solid var(--rule); font-size: 12.5px; }
  #modal-list .chg-val { font: 12px ui-monospace, Menlo, monospace; white-space: nowrap; }
  #modal-list .old { color: #9a9488; }
  #modal-list .arrow { margin: 0 5px; color: #9a9488; }
  #modal-list .new { color: var(--accent); font-weight: 600; }
  .modal-actions { display: flex; justify-content: flex-end; margin-top: 14px; }
  .modal-actions button { padding: 8px 16px; }

  /* ---- dark: dusk, not black ---- */
  :root[data-theme="dark"] {
    --paper: #1e1b22; --ink: #ece7e1; --muted: #a79fae; --rule: #3a3446;
    --accent: #e0895f; --ok: #7fc79a; --warn: #d9b06a;
  }
  [data-theme="dark"] .nav { background: #262230; border-right-color: #3a3446; }
  [data-theme="dark"] .tabs button:hover { background: rgba(255,255,255,.05); }
  [data-theme="dark"] .tabs button.on { background: #2f2a3b; box-shadow: none; }
  [data-theme="dark"] button.primary { background: var(--accent); border-color: var(--accent); color: #1e1b22; }
  [data-theme="dark"] button.primary:hover { background: #f0a077; border-color: #f0a077; }
  [data-theme="dark"] .pv-head { background: #262230; color: var(--ink); }
  [data-theme="dark"] .pv-head span { opacity: .7; }
  [data-theme="dark"] .pv-stage { background: linear-gradient(160deg, #2a2534, #211d29); }
  [data-theme="dark"] .pv-win { background: #272330; box-shadow: 0 16px 36px rgba(0,0,0,.45); }
  [data-theme="dark"] .pv-bar { background: #332e3c; }
  [data-theme="dark"] .pv-bar i { background: #4d4659; }
  [data-theme="dark"] .pv-body { color: #e2dce8; }
  [data-theme="dark"] .pv-dock { background: rgba(255,255,255,.09); box-shadow: 0 6px 18px rgba(0,0,0,.35); }
  [data-theme="dark"] .pv-dock span { background: #4d4659; }
  [data-theme="dark"] .pv-label, [data-theme="dark"] .preset-note { color: #a79fae; }
  [data-theme="dark"] .info { border-color: #4d4659; color: #a79fae; }
  [data-theme="dark"] .info[aria-expanded="true"] { background: var(--accent); border-color: var(--accent); color: #1e1b22; }
  [data-theme="dark"] .dot { background: #4d4659; }
  [data-theme="dark"] .legendbox summary, [data-theme="dark"] #modal-list li.head,
  [data-theme="dark"] #modal-list .old { color: #948b9f; }
  [data-theme="dark"] .modal { background: rgba(16,14,20,.66); }
  [data-theme="dark"] .modal .card { background: #262230; border-color: #4d4659; }
  [data-theme="dark"] .slider { accent-color: var(--accent); }
  /* ---- app shell: vertical tabs ---- */
  .shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
  .nav { background: #f2efe8; border-right: 1px solid var(--rule); padding: 20px 12px 16px;
         display: flex; flex-direction: column; gap: 16px; position: sticky; top: 0; height: 100vh; }
  .brand { display: flex; flex-direction: column; gap: 3px; padding: 0 8px; }
  .wordmark { font: 600 15px/1.1 -apple-system, system-ui, sans-serif; letter-spacing: -.01em; }
  .brand .meta { font-size: 10.5px; }
  .tabs { display: flex; flex-direction: column; gap: 1px; }
  .tabs button { text-transform: none; letter-spacing: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px;
                 width: 100%; padding: 7px 9px; border: 0; border-radius: 7px; background: transparent;
                 font: 13px/1.25 -apple-system, system-ui, sans-serif; color: var(--ink);
                 cursor: pointer; text-align: left; }
  .tabs button span { font: 11px ui-monospace, Menlo, monospace; color: #9a958a; }
  .tabs button:hover { background: rgba(255,255,255,.6); }
  .tabs button.on { background: #fff; font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.07); }
  .tabs button.on span { color: var(--accent); }
  .nav-actions { margin-top: auto; display: flex; flex-direction: column; gap: 7px; padding: 0 4px; }
  .nav-actions select { width: 100%; }
  .preset-note { font-size: 10.5px; line-height: 1.45; color: #7d786d; padding: 0 2px; }
  .rowbtns { display: flex; gap: 5px; }
  .rowbtns button { flex: 1; padding: 7px 6px; font-size: 10.5px; letter-spacing: .06em; }
  main { padding: 24px 30px 44px; max-width: 900px; }
  @media (max-width: 720px) {
    .shell { grid-template-columns: 1fr; }
    .nav { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--rule); }
    .tabs { flex-direction: row; flex-wrap: wrap; }
    .nav-actions { margin-top: 0; }
  }
  /* ---- row: one line, details behind the ⓘ ---- */
  .row { align-items: center; }
  .line { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .info { width: 17px; height: 17px; flex: 0 0 auto; border-radius: 999px; border: 1px solid #cfcac0;
          background: transparent; color: #8a867c; font: 700 11px/1 ui-monospace, Menlo, monospace;
          display: grid; place-items: center; cursor: pointer; padding: 0; transition: .15s; }
  .info:hover { border-color: #8a1c1c; color: #8a1c1c; }
  .info[aria-expanded="true"] { background: #8a1c1c; border-color: #8a1c1c; color: #fbfbf9; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #c9c4ba; flex: 0 0 auto; }
  .dot.sync { background: #2f6b4f; } .dot.drift { background: #b58900; } .dot.unset { background: #c9c4ba; }
  .detail { margin: 8px 0 2px 27px; font-size: 12.5px; line-height: 1.55; color: #5a564d; }
  .detail .key { margin-top: 5px; font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: #8d887c; }
  details.legendbox { display: inline-block; margin: 0 0 12px 6px; vertical-align: baseline; }
  details.legendbox > summary { cursor: pointer; font-size: 11px; letter-spacing: .1em; color: #8a867c; list-style: none; }
  details.legendbox > summary::-webkit-details-marker { display: none; }
  details.legendbox > summary:hover { color: #8a1c1c; }
  /* ---- adjustable numeric rows ---- */
  .slider { flex: 1; width: auto; margin: 0; accent-color: #8a1c1c; height: 18px; }
  .slabel { display: flex; align-items: center; gap: 10px; width: 100%; }
  .slabel b { min-width: 36px; text-align: right; font: 600 12px ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; }
  /* ---- preview: a simulation of the settings, not a screenshot ---- */
  .preview { margin: 24px 0 30px; border: 2px solid var(--ink); border-radius: 10px; overflow: hidden; }
  .pv-head { display: flex; align-items: baseline; gap: 12px; padding: 9px 14px; background: var(--ink); color: #fbfbf9; }
  .pv-head b { font-size: 11px; letter-spacing: .16em; }
  .pv-head span { font-size: 11px; opacity: .65; font-variant-numeric: tabular-nums; }
  .pv-stage { position: relative; height: 200px; display: flex; align-items: center; justify-content: center;
              background: linear-gradient(160deg, #eceae3, #d9d5ca); }
  .pv-win { width: 76%; max-width: 430px; background: #fbfbf9; overflow: hidden;
            box-shadow: 0 16px 36px rgba(0,0,0,.20); border-radius: 16px; transition: border-radius .3s ease; }
  .pv-bar { height: 24px; background: #efece6; display: flex; align-items: center; gap: 6px; padding: 0 10px; }
  .pv-bar i { width: 8px; height: 8px; border-radius: 50%; background: #c9c4ba; }
  .pv-body { display: flex; justify-content: space-between; gap: 16px; padding: 13px 15px;
             font: 13px/1.5 ui-monospace, Menlo, monospace; color: #33322e; }
  .pv-ans { color: #8a1c1c; font-weight: 600; }
  .pv-dock { position: absolute; bottom: 12px; display: flex; gap: 7px; padding: 7px 9px;
             background: rgba(255,255,255,.78); border-radius: 11px; box-shadow: 0 6px 18px rgba(0,0,0,.12);
             animation: pvDock 2.6s ease-in-out infinite; }
  .pv-dock span { width: 24px; height: 24px; border-radius: 6px; background: #b7b1a5; display: block; }
  @keyframes pvDock { 0%, 58% { transform: translateY(0); } 76%, 100% { transform: translateY(70px); } }

  .pv-stage { gap: 26px; }
  .pv-col { width: 41%; max-width: 380px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .pv-win { width: 100%; }
  .pv-label { font-size: 10px; letter-spacing: .02em; color: #5a564d; }
  .pv-dock { position: static; animation: none; } to { left: calc(100% - 18px); } }
</style>
</head>
<body>
<div class="shell">
<aside class="nav">
  <div class="brand">
    <span class="wordmark">macfeel</span>
    <span class="meta" id="meta">&hellip;</span>
  </div>
  <nav id="tabs" class="tabs"></nav>
  <div class="nav-actions">
    <select id="theme" title="Theme"></select>
    <select id="lang" title="Language"></select>
    <select id="profile" title="preset"></select>
    <div class="preset-note" id="preset-note"></div>
    <div class="rowbtns">
      <button id="dry" data-ui="ui.dry">DRY RUN</button>
      <button id="apply" class="primary" data-ui="ui.apply">APPLY</button>
      <button id="restore" data-ui="ui.restore" title="restore">&#8617;</button>
    </div>
  </div>
</aside>
<main>
  <p class="lede" id="lede"></p>
  <details class="legendbox"><summary id="legendbtn">?</summary><p class="legend" id="legend"></p></details>
<section class="preview" aria-label="preview">
  <div class="pv-head"><b data-ui="ui.preview.title">PREVIEW</b><span id="pv-meta"></span></div>
  <div class="pv-stage">
    <div class="pv-col">
      <div class="pv-win" id="pv-now">
        <div class="pv-bar"><i></i><i></i><i></i></div>
        <div class="pv-body"><span>午餐 120 + 80</span><b class="pv-ans">200</b></div>
      </div>
      <div class="pv-dock" id="pv-dock-now"><span></span><span></span><span></span><span></span></div>
      <div class="pv-label" id="pv-label-now">now</div>
    </div>
    <div class="pv-col">
      <div class="pv-win" id="pv-after">
        <div class="pv-bar"><i></i><i></i><i></i></div>
        <div class="pv-body"><span>午餐 120 + 80</span><b class="pv-ans">200</b></div>
      </div>
      <div class="pv-dock" id="pv-dock-after"><span></span><span></span><span></span><span></span></div>
      <div class="pv-label" id="pv-label-after">after</div>
    </div>
  </div>
</section>
  <div id="rows"></div>
  <pre id="out"></pre>
  <footer id="footer"></footer>
</main>
</div>

<div class="modal" id="modal" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 id="modal-title"></h2>
    <p class="modal-sub" id="modal-sub"></p>
    <ul id="modal-list"></ul>
    <div class="modal-actions">
      <button id="modal-cancel"></button>
      <button id="modal-accept" class="primary"></button>
    </div>
  </div>
</div>

<script>
let STATE = null, active = null;
const LANG_KEY = "macfeel.lang";

function lang() { return STATE ? STATE.lang : "en"; }
function ui(key) { return (STATE && STATE.ui && STATE.ui[key]) || key; }
function fill(tpl, vars) {
  return tpl.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? vars[k] : m));
}

async function api(path, body) {
  const sep = path.includes("?") ? "&" : "?";
  const url = path.startsWith("/api/state") ? `${path}${sep}lang=${lang()}` : path;
  const r = await fetch(url, body ? {method: "POST", headers: {"Content-Type": "application/json"},
                                     body: JSON.stringify({...body, lang: lang()})} : {});
  return r.json();
}


function liveNum(id, fb) {
  const it = (STATE.items || []).find(x => x.id === id);
  if (!it) return fb;
  const raw = (it.current !== null && it.current !== undefined) ? it.current : it.want;
  const v = parseFloat(raw);
  return Number.isFinite(v) ? v : fb;
}

function liveLevel() {
  const speed = STATE.speed || {};
  const cur = liveNum("win.resize-time", NaN);
  for (const [lvl, keys] of Object.entries(speed)) {
    const v = parseFloat(keys["win.resize-time"]);
    if (Number.isFinite(v) && Math.abs(v - cur) < 1e-6) return lvl;
  }
  return null;
}

function levelNum(lvl, id, fb) {
  const speed = STATE.speed || {};
  const v = parseFloat((speed[lvl] || {})[id]);
  return Number.isFinite(v) ? v : fb;
}

function renderPreview() {
  const now = liveLevel() || "1";
  const cols = [
    { lvl: "5", name: ui("ui.preview.stock"),   win: "pv-now",   label: "pv-label-now" },
    { lvl: now, name: ui("ui.preview.current"), win: "pv-after", label: "pv-label-after" },
  ];
  for (const c of cols) {
    const radius = c.lvl === "5" ? 16 : liveNum("win.corner", 16);
    const dock = levelNum(c.lvl, "dock.autohide-time", 0.5);
    const repeat = levelNum(c.lvl, "kbd.repeat", 6);
    const w = document.getElementById(c.win);
    if (w) w.style.borderRadius = Math.max(0, Math.min(radius, 18)) + "px";
    const d = document.getElementById(c.win + "").closest(".pv-col").querySelector(".pv-dock");
    if (d) d.style.animationDuration = (0.8 + dock * 2.2).toFixed(2) + "s";
    const lab = document.getElementById(c.label);
    if (lab) {
      const name = c.name.replace("{level}", c.lvl);
      lab.textContent = name + " — " + fill(ui("ui.preview.side"),
        {corner: radius, dock: dock, repeat: repeat});
    }
  }
  const m = document.getElementById("pv-meta");
  if (m) m.textContent = ui("ui.preview.hint");
}

function render() {
  const {macos, sip, items, groups, langs, langLabels} = STATE;
  document.documentElement.lang = lang().replace("_", "-");
  document.getElementById("meta").textContent =
    `macOS ${macos} · ${sip.replace("System Integrity Protection status: ", "SIP ")}`;

  const themeSel = document.getElementById("theme");
  if (themeSel) {
    const pref = document.documentElement.dataset.pref || "auto";
    themeSel.innerHTML = ["auto", "light", "dark"]
      .map(v => `<option value="${v}">${ui("theme." + v)}</option>`).join("");
    themeSel.value = pref;
  }
  const legendBtn = document.getElementById("legendbtn");
  if (legendBtn) legendBtn.textContent = "? " + ui("ui.legendbtn");
  const profSel = document.getElementById("profile");
  if (profSel && Array.isArray(STATE.presets)) {
    const want = profSel.value || "light";
    profSel.innerHTML = STATE.presets
      .map(p => `<option value="${p.id}">${ui("preset." + p.id)} \u00b7 ${p.count}</option>`)
      .join("");
    profSel.value = STATE.presets.some(p => p.id === want) ? want : STATE.presets[0].id;
  }
  const presetNote = document.getElementById("preset-note");
  if (presetNote && profSel) presetNote.textContent = ui("preset." + profSel.value + ".note");
  const langSel = document.getElementById("lang");
  if (langSel.options.length !== langs.length) {
    langSel.innerHTML = langs.map(l => `<option value="${l}">${langLabels[l]}</option>`).join("");
  }
  langSel.value = lang();

  document.querySelectorAll("[data-ui]").forEach(el => {
    el.textContent = ui(el.getAttribute("data-ui"));
  });

  if (!active || !groups.some(g => g.name === active)) active = groups[0] ? groups[0].name : null;

  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  for (const g of groups) {
    const n = items.filter(i => i.group === g.name).length;
    if (!n) continue;
    const b = document.createElement("button");
    b.innerHTML = `${g.subtitle || g.name}<span>${n}</span>`;
    if (g.name === active) b.className = "on";
    b.onclick = () => { active = g.name; render(); };
    tabs.appendChild(b);
  }

  const shown = items.filter(i => i.group === active);
  const g = groups.find(x => x.name === active) || {};
  const drift = shown.filter(i => i.state !== "sync").length;
  document.getElementById("lede").textContent =
    fill(ui("ui.lede"), {subtitle: g.subtitle || "", count: shown.length, drift});
  document.getElementById("legend").innerHTML =
    `<b class="sync">${ui("ui.in-sync")}</b> · <b class="drift">${ui("ui.drift")}</b> · ` +
    `<b class="unset">${ui("ui.unset")}</b> — ${ui("ui.legend")}`;

  const rows = document.getElementById("rows");
  rows.innerHTML = "";
  for (const t of shown) {
    const row = document.createElement("div");
    row.className = "row";
    const label = {sync: ui("ui.in-sync"), drift: ui("ui.drift"), unset: ui("ui.unset")}[t.state];
    // A row shows a label, not a paragraph: cut the sentence at its natural seam
    // and keep the whole description one click away behind the (i).
    const splitLabel = (text) => {
      const s = String(text || "").trim();
      const dash = s.indexOf(" — ");
      if (dash > 0 && dash <= 64) return [s.slice(0, dash), s.slice(dash + 3)];
      const stop = s.search(/\.\s|。|\uFF0E/);
      if (stop > 0 && stop <= 64) return [s.slice(0, stop), s.slice(stop + 1).trim()];
      if (s.length <= 40) return [s, ""];
      const cut = s.lastIndexOf(" ", 40);
      const at = cut > 20 ? cut : 40;
      return [s.slice(0, at).trim(), s.slice(at).trim()];
    };
    const [shortDesc, extraDesc] = splitLabel(t.desc);
    row.innerHTML = `
      <div class="main">
        <div class="line">
          <button class="info" aria-expanded="false" aria-label="${ui("ui.details")}" title="${ui("ui.details")}">!</button>
          <span class="name">${shortDesc}</span>
          <span class="dot ${t.state}" title="${label}"></span>
        </div>
        <div class="detail" hidden>
          <div class="note full">${t.desc}</div>
          ${t.note ? `<div class="note">${t.note}</div>` : ""}
          <div class="key">${t.domain} ${t.key} = ${t.want}${t.current !== null ? ` · now: ${t.current}` : ""}${t.needsLabel ? `<span class="tag">${t.needsLabel}</span>` : ""}</div>
        </div>
      </div>
      <div class="side">
        ${t.range ? `
        <div class="slabel">
          <input class="slider" type="range" data-id="${t.id}" aria-label="${t.desc}"
                 min="${t.range.min}" max="${t.range.max}" step="${t.range.step}"
                 value="${t.current !== null && t.current !== "" ? t.current : t.want}">
          <b data-role="cur">${t.current !== null && t.current !== "" ? t.current : "—"}</b>
        </div>` : `
        <div class="swrow">
          <button class="switch" role="switch" aria-checked="${t.state === "sync"}" data-id="${t.id}"
                  aria-label="${t.desc}" title="${t.state === "sync" ? ui("ui.revert") : ui("ui.apply")}"><span></span></button>
        </div>`}
      </div>`;
    const info = row.querySelector(".info");
    info.onclick = () => {
      const d = row.querySelector(".detail");
      const opening = d.hasAttribute("hidden");
      if (opening) d.removeAttribute("hidden"); else d.setAttribute("hidden", "");
      info.setAttribute("aria-expanded", String(opening));
    };
    const sw = row.querySelector(".switch");
    if (sw) sw.onclick = () => toggle(t.id);
    const sl = row.querySelector(".slider");
    if (sl) {
      const out = row.querySelector('[data-role="cur"]');
      sl.oninput = () => { if (out) out.textContent = sl.value; };
      sl.onchange = async () => {
        show("…");
        const r = await api("/api/set", {id: t.id, value: sl.value});
        if (r.state) { STATE = r.state; render(); }
        show(r.out || "");
      };
    }
    rows.appendChild(row);
  }
  renderPreview();
  document.getElementById("footer").innerHTML =
    `${ui("ui.footer")} · <a href="https://buymeacoffee.com/kinfxhk" target="_blank">☕ Buy Me a Coffee</a>`;
}

async function toggle(id) {
  show("…");
  const r = await api("/api/toggle", {id});
  STATE = r.state; render(); show(r.out || "");
}

function fmtValue(v, type, unit, label) {
  if (v === null || v === undefined || v === "") return ui("value.unset");
  if (type === "bool") return (v === true || v === "1" || v === 1 || v === "true") ? ui("value.on") : ui("value.off");
  let out = String(v);
  if (unit) out += " " + unit;
  if (label) out += "（" + label + "）";
  return out;
}

let pendingApply = null;

function showChanges(changes, opts) {
  const {confirm, dry} = opts || {};
  const modal = document.getElementById("modal");
  const list = document.getElementById("modal-list");
  document.getElementById("modal-title").textContent =
    (dry ? ui("dialog.dry") : ui("dialog.title")).replace("{count}", changes.length);
  document.getElementById("modal-sub").textContent =
    (dry || !changes.length) ? ui("dialog.note") : ui("dialog.confirm");
  list.innerHTML = changes.length ? `<li class="head"><span>${ui("dialog.col.setting")}</span><span>${ui("dialog.col.value")}</span></li>` : "" ;
  list.innerHTML += changes.length
    ? changes.map(c => `<li><span class="chg-name">${c.desc}</span>
        <span class="chg-val"><span class="old">${fmtValue(c.before, c.type, c.unit, c.before_label)}</span>
        <span class="arrow">\u2192</span><span class="new">${fmtValue(c.after, c.type, c.unit, c.after_label)}</span></span></li>`).join("")
    : `<li><span class="chg-name">${ui("dialog.none")}</span></li>`;
  document.getElementById("modal-cancel").textContent = ui("dialog.cancel");
  const accept = document.getElementById("modal-accept");
  accept.textContent = ui("dialog.accept");
  accept.hidden = !confirm || !changes.length;
  modal.hidden = false;
  (accept.hidden ? document.getElementById("modal-cancel") : accept).focus();
}

async function previewApply(dry) {
  const profile = document.getElementById("profile").value;
  show("…");
  const r = await api("/api/apply", {profile, dry: true});
  if (r.state) { STATE = r.state; render(); }
  pendingApply = dry ? null : {profile, changes: r.changes || []};
  showChanges(r.changes || [], {confirm: !dry, dry});
  show("");
}

async function acceptApply() {
  if (!pendingApply) return;
  const profile = pendingApply.profile;
  pendingApply = null;
  document.getElementById("modal").hidden = true;
  show(`macfeel apply ${profile}…`);
  const r = await api("/api/apply", {profile, dry: false});
  if (r.state) { STATE = r.state; render(); }
  show(r.out || "");
}

function show(text) {
  const o = document.getElementById("out");
  o.textContent = text;
  o.className = text ? "on" : "";
}

function closeModal() {
  document.getElementById("modal").hidden = true;
  pendingApply = null;
}

document.getElementById("modal-cancel").onclick = closeModal;
document.getElementById("modal-accept").onclick = acceptApply;
document.getElementById("modal").onclick = (e) => { if (e.target.id === "modal") closeModal(); };
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

document.getElementById("apply").onclick = () => previewApply(false);
document.getElementById("dry").onclick = () => previewApply(true);
document.getElementById("restore").onclick = restore;
document.getElementById("theme").onchange = (e) => {
  const pref = e.target.value;
  localStorage.setItem("macfeel.theme", pref);
  const dark = pref === "dark" || (pref === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  document.documentElement.dataset.pref = pref;
};
document.getElementById("lang").onchange = async (e) => {
  localStorage.setItem(LANG_KEY, e.target.value);
  const r = await api(`/api/state?lang=${e.target.value}`);
  STATE = r; render();
};

(async () => {
  const wanted = localStorage.getItem(LANG_KEY);
  const r = await api(wanted ? `/api/state?lang=${wanted}` : "/api/state");
  STATE = r; render();
})();
</script>
</body>
</html>
