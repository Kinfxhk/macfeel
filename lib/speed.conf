# macfeel speed scale — the same tweaks, expressed as five graded levels.
# level<TAB>id<TAB>value
#
# 1 = 瞬速   2 = 快   3 = 平衡   4 = 順滑   5 = 原生（Apple 預設手感）
# Only ids that already exist in lib/tweaks.conf may appear here; the CLI joins
# domain/key/type/needs from that table so there is exactly one source of truth.
1	win.resize-time	0.001
1	win.no-animations	false
1	dock.autohide-time	0
1	dock.expose-speed	0.05
1	dock.mineffect	scale
1	kbd.repeat	1
1	kbd.repeat-initial	10
2	win.resize-time	0.05
2	win.no-animations	false
2	dock.autohide-time	0.1
2	dock.expose-speed	0.1
2	dock.mineffect	scale
2	kbd.repeat	1
2	kbd.repeat-initial	12
3	win.resize-time	0.1
3	win.no-animations	true
3	dock.autohide-time	0.15
3	dock.expose-speed	0.15
3	dock.mineffect	scale
3	kbd.repeat	2
3	kbd.repeat-initial	15
4	win.resize-time	0.15
4	win.no-animations	true
4	dock.autohide-time	0.25
4	dock.expose-speed	0.2
4	dock.mineffect	genie
4	kbd.repeat	4
4	kbd.repeat-initial	20
5	win.resize-time	0.2
5	win.no-animations	true
5	dock.autohide-time	0.5
5	dock.expose-speed	0.25
5	dock.mineffect	genie
5	kbd.repeat	6
5	kbd.repeat-initial	25
