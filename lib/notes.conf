# id<TAB>long explanation (shown in the GUI and by `macfeel list --long`)
chrome.hide-menubar	選單列自動隱藏（滑鼠向上移動才出現）。最接近 Linux 全螢幕，但會失去常駐時鐘／電量。
dock.autohide	Dock 自動隱藏，不用時完全消失，換取更多螢幕高度。
dock.autohide-delay	滑鼠移至螢幕底部立刻彈出 Dock，沒有 0.5 秒等待。
dock.autohide-time	Dock 出現／收起動畫時長，0.15 秒幾乎即時。
dock.expose-speed	Mission Control 動畫由 ~0.4 秒減到 0.1 秒，切換 Space／看全部窗口立刻出現。
dock.mineffect	縮到 Dock 用 scale（直接縮小），不用 genie（被吸下去），快很多。
dock.no-launch-anim	開啟 app 時，Dock 圖示不再彈跳，少一個干擾。
dock.no-recents	Dock 右邊不再顯示「最近使用」區，只留你放上去的 app。
finder.extensions	所有檔案顯示副檔名，不會再有兩個同名不同類的檔案看不出分別。
finder.folders-first	排序時資料夾永遠排在前面，與 Linux 檔案管理員一致。
finder.fullpath	Finder 標題列顯示完整路徑，不止資料夾名。
finder.no-ds-network	網絡卷（NAS、SMB）不再寫入 .DS_Store，不會污染共享資料夾。
finder.no-ds-usb	USB／外接磁碟不寫入 .DS_Store。
finder.no-ext-warning	修改副檔名不再彈出警告（你知道自己在做甚麼）。
finder.pathbar	Finder 視窗底部顯示路徑列，一眼看到檔案在哪裡。
finder.statusbar	Finder 視窗底部顯示「N 個項目，可用 xx GB」。
kbd.full-keyboard-access	Tab 可以 focus 所有控制項（按鈕、剔選框、下拉），不止文字框。純鍵盤操作 app 的必要條件。
kbd.no-autocapitalize	關閉自動大寫。句首、換行後不會自動變成大寫。
kbd.no-autocorrect	關閉自動拼字修正，打字不會無緣無故被換字。
kbd.no-hold-popup	關閉「長按出現 ē é ě è」的字元選單。開發者必需：長按 a 應該是重複 a，不是彈出候選字。
kbd.no-smart-dashes	不再自動把 -- 變成破折號。命令行參數不會被改壞。
kbd.no-smart-quotes	不再自動把 " 變成 “ ”。寫 code、寫 SQL、打指令不會再被悄悄改了引號。
kbd.no-text-completion	關閉行內預測文字（灰字建議），不會再有東西蓋住你正在打的字。
kbd.repeat	按住鍵的重複速度，1 是最快。打字、游標移動、刪除全部立刻變得順暢。
kbd.repeat-initial	按住多久才開始重複（10 ≈ 150 ms）。與上一項一併調整，鍵盤反應才接近 Linux。
menubar.hide-fullscreen	全螢幕時不顯示選單列，多出一行畫面。
ptr.linear-mouse	關閉滑鼠加速：移動距離與手部移動成正比。注意：要登出再登入才生效，而且一旦拖動「追蹤速度」滑桿就會被重設。
ptr.natural-scroll	關閉「自然捲動」：兩指向上＝內容向上，與 Windows／Linux 一致。
ptr.tap-to-click	觸控板輕點即當左鍵，不必按下去。
shot.format	截圖用 PNG（無損），不用預設的 TIFF／JPEG。
shot.location	截圖統一存到 ~/Pictures/Screenshots，不會散落桌面。
shot.no-shadow	截圖不包括窗口陰影，貼到網上或者放入文件會乾淨很多。
shot.no-thumbnail	截圖之後右下角不再彈出縮圖擋住畫面。
spaces.fixed-order	Space（桌面）不再按「最近使用」重排。開啟之後 Space 1 永遠是 Space 1，與 i3／GNOME 工作區一樣。
win.corner	窗口四角半徑。0.1 是完全直角，4 等於 Catalina、9 等於 Sequoia、16 是 Tahoe 預設。改完要重新開啟 app 才看得到，Dock、選單列不受影響。
win.dblclick-maximize	雙擊標題列變成「放到最大」，不再是縮到 Dock。與 Windows／多數 Linux WM 一樣。
win.no-animations	關閉開窗／關窗動畫。開啟 app 和關閉 app 立刻完成，不會再看到視窗由小變大。
win.quicklook-instant	空白鍵 Quick Look 不再播放放大動畫，立刻顯示預覽。
win.resize-time	拖動窗口邊緣時的縮放動畫長度。0.001 等於即時跟手；預設大約 0.2 秒，拖動時會有「拉橡皮」感。
win.save-expanded	儲存／開啟面板預設用展開版（可以打字輸入路徑），不用簡化版。
win.save-expanded2	與上一項一樣，只是新版 AppKit 用另一個 key；兩個都設定，確保所有 app 都跟隨。
win.sidebar-float	自 Tahoe 起，側邊欄會浮起變成圓角卡片。關閉之後側邊欄貼合視窗邊緣，與 Mail／Notes 舊版一樣，可視面積更大。
win.sidebar-radius	側邊欄玻璃圓角半徑，只影響有玻璃材質側欄的 app（Finder、Mail、Notes）。
win.tableView-compact	列表行高由「中」變「小」，Finder、郵件、設定裡面的列表一次可以多看幾行。
