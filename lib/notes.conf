# id<TAB>long explanation (shown in the GUI and by `macfeel list --long`)
chrome.hide-menubar	選單列自動隱藏（滑鼠推上去才出）。最似 Linux 全螢幕，但會冇咗常駐時鐘／電量。
dock.autohide	Dock 自動隱藏，唔用時完全消失，多返螢幕高度。
dock.autohide-delay	滑鼠推到螢幕底即刻彈出 Dock，冇 0.5 秒等待。
dock.autohide-time	Dock 出現／收起動畫時長，0.15 秒幾乎即時。
dock.expose-speed	Mission Control 動畫由 ~0.4 秒減到 0.1 秒，切 Space／睇全部窗口即刻出。
dock.mineffect	縮到 Dock 用 scale（直接縮細），唔用 genie（被吸落去），快好多。
dock.no-launch-anim	關掉開 app 時 Dock 圖示彈跳，少一個干擾。
dock.no-recents	Dock 右邊唔再顯示「最近使用」區，只留你放上去嘅 app。
finder.extensions	所有檔案顯示副檔名，唔會再有兩個同名唔同類嘅檔睇唔出分別。
finder.folders-first	排序時資料夾永遠排先，同 Linux 檔案管理員一致。
finder.fullpath	Finder 標題列顯示完整路徑，唔止資料夾名。
finder.no-ds-network	網絡卷（NAS、SMB）唔再寫 .DS_Store，唔會污染共享資料夾。
finder.no-ds-usb	USB／外接碟唔寫 .DS_Store。
finder.no-ext-warning	改副檔名唔再彈警告（你知自己做咩）。
finder.pathbar	Finder 視窗底部顯示路徑列，一眼睇到檔案喺邊。
finder.statusbar	Finder 視窗底部顯示「N 個項目，可用 xx GB」。
kbd.full-keyboard-access	Tab 可以 focus 所有控制項（按鈕、剔選框、下拉），唔止文字框。純鍵盤操作 app 嘅必要條件。
kbd.no-autocapitalize	關自動大寫。句首、換行後唔會自動變大楷。
kbd.no-autocorrect	關自動拼字修正，打字唔會無啦啦被換字。
kbd.no-hold-popup	關掉「長按出 ē é ě è」嘅字元選單。開發者必需：長按 a 應該係重複 a，唔係彈候選字。
kbd.no-smart-dashes	唔再自動把 -- 變破折號。命令行參數唔會被改壞。
kbd.no-smart-quotes	唔再自動把 " 變 “ ”。寫 code、寫 SQL、打指令唔會再被靜靜改咗引號。
kbd.no-text-completion	關行內預測文字（灰字建議），唔會再有嘢蓋住你正在打嘅字。
kbd.repeat	按住鍵嘅重複速度，1 係最快。打字、游標移動、刪除全部即刻變爽。
kbd.repeat-initial	按住幾耐先開始重複（10 ≈ 150ms）。同上一項一齊調，鍵盤反應才似 Linux。
menubar.hide-fullscreen	全螢幕時唔顯示選單列，多返一行畫面。
ptr.linear-mouse	關滑鼠加速：移動距離同手移動成正比。注意：要登出再登入先生效，而且你一拉「追蹤速度」滑桿就會被重設。
ptr.natural-scroll	關「自然捲動」：兩指向上＝內容向上，同 Windows／Linux 一致。
ptr.tap-to-click	觸控板輕點即當左鍵，唔使按落去。
shot.format	截圖用 PNG（無損），唔用預設嘅 TIFF／JPEG。
shot.location	截圖統一存去 ~/Pictures/Screenshots，唔會散落桌面。
shot.no-shadow	截圖唔包窗口陰影，貼上網或者入文件乾淨好多。
shot.no-thumbnail	截圖之後右下角唔再彈縮圖擋住畫面。
spaces.fixed-order	Space（桌面）唔再按「最近使用」重排。開咗之後 Space 1 永遠係 Space 1，同 i3／GNOME 工作區一樣。
win.corner	窗口四角半徑。0.1 係完全直角，4 等於 Catalina、9 等於 Sequoia、16 係 Tahoe 預設。改完要重開 app 才見到，Dock、選單列唔受影響。
win.dblclick-maximize	雙擊標題列變成「放到最大」，唔再係縮到 Dock。同 Windows／多數 Linux WM 一樣。
win.no-animations	關掉開窗／關窗動畫。開 app 同關 app 即刻完成，唔會再見到視窗由細變大。
win.quicklook-instant	空白鍵 Quick Look 唔再放大動畫，即刻出預覽。
win.resize-time	拖窗口邊時嘅縮放動畫長度。0.001 等於即時跟手；預設大約 0.2 秒，拖嘅時候會有「拉橡皮」感。
win.save-expanded	儲存／開啟面板預設用展開版（可以打字輸入路徑），唔用簡化版。
win.save-expanded2	同上一項一樣，只係新版 AppKit 用另一個 key；兩個都設確保所有 app 都跟。
win.sidebar-float	Tahoe 起側邊欄會浮起變成圓角卡片。關掉之後側邊欄貼住窗口邊，同 Mail／Notes 舊版一樣，多咗可視面積。
win.sidebar-radius	側邊欄玻璃圓角半徑，只影響有玻璃材質側欄嘅 app（Finder、Mail、Notes）。
win.tableView-compact	列表行高由「中」變「小」，Finder、郵件、設定入面嘅列表一次過睇多幾行。
