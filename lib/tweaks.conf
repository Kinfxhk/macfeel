# macfeel tweak table — one tweak per line, TAB separated.
# id<TAB>profiles<TAB>domain<TAB>key<TAB>type<TAB>value<TAB>needs<TAB>description
#
# profiles : comma separated — light | standard | hardcore (+ chrome for the opt-in menu-bar set)
#            cumulative: standard includes light, hardcore includes standard.
#            aliases kept for old scripts: linux = hardcore, minimal = light.
# domain   : -g for NSGlobalDomain, otherwise the app domain
# type     : bool | int | float | string
# needs    : - | dock | finder | uiserver | logout | relaunch   (restart hints, never an automatic logout)
win.corner	standard	-g	NSConvolutionOverride1	float	0.1	relaunch	視窗圓角（0.1=直角，4=Catalina，9=Sequoia，16=Tahoe 預設）
win.sidebar-float	standard	-g	NSSplitViewItemSidebarDefaultsToFloatingAppearance	bool	false	relaunch	側欄貼邊，不再浮起
win.sidebar-radius	standard	-g	NSSplitViewItemGlassMinimumCornerRadius	float	4	relaunch	側欄玻璃圓角
win.no-animations	standard	-g	NSAutomaticWindowAnimationsEnabled	bool	false	relaunch	關窗／開窗動畫
win.resize-time	light	-g	NSWindowResizeTime	float	0.001	relaunch	視窗縮放動畫時長
win.save-expanded	standard	-g	NSNavPanelExpandedStateForSaveMode	bool	true	relaunch	儲存面板預設展開
win.save-expanded2	standard	-g	NSNavPanelExpandedStateForSaveMode2	bool	true	relaunch	同上（新版 API）
win.tableView-compact	standard	-g	NSTableViewDefaultSizeMode	int	1	relaunch	列表行距收窄
kbd.repeat	light	-g	KeyRepeat	int	1	-	按鍵重複速度（1=最快）
kbd.repeat-initial	light	-g	InitialKeyRepeat	int	10	-	按住多久才開始重複
kbd.no-hold-popup	light	-g	ApplePressAndHoldEnabled	bool	false	-	關閉長按選字（編寫程式／終端機必需）
dock.autohide	standard,chrome	com.apple.dock	autohide	bool	true	dock	Dock 自動隱藏
dock.autohide-delay	standard,chrome	com.apple.dock	autohide-delay	float	0	dock	滑鼠移至底部立即顯示
dock.autohide-time	standard,chrome	com.apple.dock	autohide-time-modifier	float	0.15	dock	隱藏／出現動畫時長
dock.mineffect	standard	com.apple.dock	mineffect	string	scale	dock	縮到 Dock 使用 scale（比 genie 快）
dock.no-recents	standard	com.apple.dock	show-recents	bool	false	dock	不顯示最近用過的 app
dock.expose-speed	standard	com.apple.dock	expose-animation-duration	float	0.1	dock	Mission Control 動畫
finder.extensions	light	com.apple.finder	AppleShowAllExtensions	bool	true	finder	顯示副檔名
finder.pathbar	light	com.apple.finder	ShowPathbar	bool	true	finder	顯示路徑列
finder.statusbar	light	com.apple.finder	ShowStatusBar	bool	true	finder	顯示狀態列
finder.fullpath	standard	com.apple.finder	_FXShowPosixPathInTitle	bool	true	finder	標題顯示完整路徑
finder.no-ds-network	hardcore	-g	DSDontWriteNetworkStores	bool	true	-	網絡卷不寫入 .DS_Store
finder.no-ds-usb	hardcore	-g	DSDontWriteUSBStores	bool	true	-	USB 不寫入 .DS_Store
shot.no-shadow	standard	com.apple.screencapture	disable-shadow	bool	true	-	截圖不要陰影
shot.format	standard	com.apple.screencapture	type	string	png	-	截圖格式 png
shot.location	standard	com.apple.screencapture	location	string	~/Pictures/Screenshots	-	截圖儲存至固定資料夾
ptr.natural-scroll	hardcore	-g	com.apple.swipescrolldirection	bool	false	-	關自然捲動（Linux 方向）
ptr.linear-mouse	hardcore	-g	com.apple.mouse.scaling	float	-1	logout	關閉滑鼠加速（需登出；拖動「追蹤速度」滑桿會重設）
ptr.tap-to-click	hardcore	com.apple.AppleMultitouchTrackpad	Clicking	bool	true	-	觸控板輕點即按
chrome.hide-menubar	hardcore,chrome	-g	_HIHideMenuBar	bool	true	uiserver	選單列自動隱藏
kbd.no-smart-quotes	light	-g	NSAutomaticQuoteSubstitutionEnabled	bool	false	-	關閉智能引號（寫 code 不會變成 “ ”）
kbd.no-smart-dashes	light	-g	NSAutomaticDashSubstitutionEnabled	bool	false	-	關智能破折號
kbd.no-autocorrect	light	-g	NSAutomaticSpellingCorrectionEnabled	bool	false	-	關自動拼字修正
kbd.no-autocapitalize	light	-g	NSAutomaticCapitalizationEnabled	bool	false	-	關自動大寫
kbd.no-text-completion	light	-g	NSAutomaticTextCompletionEnabled	bool	false	-	關行內預測文字
kbd.full-keyboard-access	hardcore	-g	AppleKeyboardUIMode	int	3	-	Tab 可以 focus 所有控制項（Linux 式鍵盤操作）
win.dblclick-maximize	light	-g	AppleActionOnDoubleClick	string	Maximize	-	雙擊標題列 = 放到最大（而非縮到 Dock）
win.quicklook-instant	standard	-g	QLPanelAnimationDuration	float	0	-	Quick Look 不要放大動畫
dock.no-launch-anim	light	com.apple.dock	launchanim	bool	false	dock	關閉開啟 app 時的 Dock 彈跳動畫
spaces.fixed-order	hardcore	com.apple.dock	mru-spaces	bool	false	dock	Space 不按最近使用重排（固定工作區）
menubar.hide-fullscreen	hardcore	-g	AppleMenuBarVisibleInFullscreen	bool	false	-	全螢幕時不顯示選單列
shot.no-thumbnail	standard	com.apple.screencapture	show-thumbnail	bool	false	-	截圖後不彈出縮圖
finder.folders-first	standard	com.apple.finder	_FXSortFoldersFirst	bool	true	finder	資料夾排在前面
finder.no-ext-warning	light	com.apple.finder	FXEnableExtensionChangeWarning	bool	false	finder	修改副檔名不再彈出警告
finder.view-style	standard	com.apple.finder	FXPreferredViewStyle	string	Nlsv	finder	Finder 新視窗預設列表檢視
finder.search-current	standard	com.apple.finder	FXDefaultSearchScope	string	SCcf	finder	搜尋預設在目前資料夾
finder.ql-select	standard	com.apple.finder	QLEnableTextSelection	bool	true	-	快速查看可以選字複製
