# macfeel tweak table — one tweak per line, TAB separated.
# id<TAB>profiles<TAB>domain<TAB>key<TAB>type<TAB>value<TAB>needs<TAB>description
#
# profiles : comma separated (linux,minimal,chrome)
# domain   : -g for NSGlobalDomain, otherwise the app domain
# type     : bool | int | float | string
# needs    : - | dock | finder | uiserver | logout | relaunch   (restart hints, never an automatic logout)
win.corner	linux,minimal	-g	NSConvolutionOverride1	float	0.1	relaunch	視窗圓角（0.1=直角，4=Catalina，9=Sequoia，16=Tahoe 預設）
win.sidebar-float	linux	-g	NSSplitViewItemSidebarDefaultsToFloatingAppearance	bool	false	relaunch	側欄貼邊，唔再浮起
win.sidebar-radius	linux	-g	NSSplitViewItemGlassMinimumCornerRadius	float	4	relaunch	側欄玻璃圓角
win.no-animations	linux,minimal	-g	NSAutomaticWindowAnimationsEnabled	bool	false	relaunch	關窗／開窗動畫
win.resize-time	linux,minimal	-g	NSWindowResizeTime	float	0.001	relaunch	視窗縮放動畫時長
win.save-expanded	linux	-g	NSNavPanelExpandedStateForSaveMode	bool	true	relaunch	儲存面板預設展開
win.save-expanded2	linux	-g	NSNavPanelExpandedStateForSaveMode2	bool	true	relaunch	同上（新版 API）
win.tableView-compact	linux	-g	NSTableViewDefaultSizeMode	int	1	relaunch	列表行距收窄
kbd.repeat	linux,minimal	-g	KeyRepeat	int	1	-	按鍵重複速度（1=最快）
kbd.repeat-initial	linux,minimal	-g	InitialKeyRepeat	int	10	-	按住幾耐才開始重複
kbd.no-hold-popup	linux	-g	ApplePressAndHoldEnabled	bool	false	-	關長按彈字（打 code／終端機必需）
dock.autohide	linux,chrome	com.apple.dock	autohide	bool	true	dock	Dock 自動隱藏
dock.autohide-delay	linux,chrome	com.apple.dock	autohide-delay	float	0	dock	滑到底即刻出
dock.autohide-time	linux,chrome	com.apple.dock	autohide-time-modifier	float	0.15	dock	隱藏／出現動畫時長
dock.mineffect	linux	com.apple.dock	mineffect	string	scale	dock	縮到 Dock 用 scale（快過 genie）
dock.no-recents	linux	com.apple.dock	show-recents	bool	false	dock	唔顯示最近用過嘅 app
dock.expose-speed	linux	com.apple.dock	expose-animation-duration	float	0.1	dock	Mission Control 動畫
finder.extensions	linux	com.apple.finder	AppleShowAllExtensions	bool	true	finder	顯示副檔名
finder.pathbar	linux	com.apple.finder	ShowPathbar	bool	true	finder	顯示路徑列
finder.statusbar	linux	com.apple.finder	ShowStatusBar	bool	true	finder	顯示狀態列
finder.fullpath	linux	com.apple.finder	_FXShowPosixPathInTitle	bool	true	finder	標題顯示完整路徑
finder.no-ds-network	linux	-g	DSDontWriteNetworkStores	bool	true	-	網絡卷唔寫 .DS_Store
finder.no-ds-usb	linux	-g	DSDontWriteUSBStores	bool	true	-	USB 唔寫 .DS_Store
shot.no-shadow	linux	com.apple.screencapture	disable-shadow	bool	true	-	截圖唔要陰影
shot.format	linux	com.apple.screencapture	type	string	png	-	截圖格式 png
shot.location	linux	com.apple.screencapture	location	string	~/Pictures/Screenshots	-	截圖存去固定資料夾
ptr.natural-scroll	linux	-g	com.apple.swipescrolldirection	bool	false	-	關自然捲動（Linux 方向）
ptr.linear-mouse	linux	-g	com.apple.mouse.scaling	float	-1	logout	關滑鼠加速（要登出；一拉「追蹤速度」滑桿會重設）
ptr.tap-to-click	linux	com.apple.AppleMultitouchTrackpad	Clicking	bool	true	-	觸控板輕點即按
chrome.hide-menubar	chrome	-g	_HIHideMenuBar	bool	true	uiserver	選單列自動隱藏
kbd.no-smart-quotes	linux	-g	NSAutomaticQuoteSubstitutionEnabled	bool	false	-	關智能引號（打 code 唔會變 “ ”）
kbd.no-smart-dashes	linux	-g	NSAutomaticDashSubstitutionEnabled	bool	false	-	關智能破折號
kbd.no-autocorrect	linux	-g	NSAutomaticSpellingCorrectionEnabled	bool	false	-	關自動拼字修正
kbd.no-autocapitalize	linux	-g	NSAutomaticCapitalizationEnabled	bool	false	-	關自動大寫
kbd.no-text-completion	linux	-g	NSAutomaticTextCompletionEnabled	bool	false	-	關行內預測文字
kbd.full-keyboard-access	linux	-g	AppleKeyboardUIMode	int	3	-	Tab 可以 focus 所有控制項（Linux 式鍵盤操作）
win.dblclick-maximize	linux	-g	AppleActionOnDoubleClick	string	Maximize	-	雙擊標題列 = 放到最大（唔係縮到 Dock）
win.quicklook-instant	linux	-g	QLPanelAnimationDuration	float	0	-	Quick Look 唔要放大動畫
dock.no-launch-anim	linux	com.apple.dock	launchanim	bool	false	dock	關 Dock 開 app 彈跳動畫
spaces.fixed-order	linux	com.apple.dock	mru-spaces	bool	false	dock	Space 唔按最近使用重排（固定工作區）
menubar.hide-fullscreen	linux	-g	AppleMenuBarVisibleInFullscreen	bool	false	-	全螢幕時唔顯示選單列
shot.no-thumbnail	linux	com.apple.screencapture	show-thumbnail	bool	false	-	截圖後唔彈縮圖
finder.folders-first	linux	com.apple.finder	_FXSortFoldersFirst	bool	true	finder	資料夾排先
finder.no-ext-warning	linux	com.apple.finder	FXEnableExtensionChangeWarning	bool	false	finder	改副檔名唔再問
